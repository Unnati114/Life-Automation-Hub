
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reminders - LETAH</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(120deg,#f0f9ff,#e0f2fe,#dbeafe);
}

/* Navbar */

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 40px;
    background:linear-gradient(90deg,#1e3a8a,#2563eb);
    color:white;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo img{
    width:40px;
}

nav ul{
    display:flex;
    list-style:none;
    gap:20px;
}

nav ul li a{
    text-decoration:none;
    color:white;
    padding:10px 18px;
    border-radius:8px;
    transition:0.3s;
}

nav ul li a:hover{
    background:white;
    color:#2563eb;
}

.active{
    background:white;
    color:#2563eb;
}

.logout{
    background:#ef4444;
}

/* Dashboard */

.dashboard{
    padding:40px;
}

/* Reminder Form */

.reminder-form{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
    margin-top:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.reminder-form input{
    padding:10px;
    border-radius:8px;
    border:1px solid #ccc;
}

/* Button */

button{
    padding:10px 18px;
    background:linear-gradient(45deg,#2563eb,#1e3a8a);
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.05);
}

/* Cards */

.card-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.card-box{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

.delete-btn{
    margin-top:10px;
    background:#ef4444;
}

</style>
</head>

<body>

<nav>

<div class="logo">
<img src="logo.png">
<h2>LETAH</h2>
</div>

<ul>
<li><a href="dashboard.html">Dashboard</a></li>
<li><a href="tasks.html">Tasks</a></li>
<li><a class="active" href="reminders.html">Reminders</a></li>
<li><a href="documents.html">Documents</a></li>
<li><a href="expenses.html">Expenses</a></li>
<li><a href="assistant.html">AI Assistant</a></li>
<li><a href="profile.html">Profile</a></li>
<li><a class="logout" href="index.html">Logout</a></li>
</ul>

</nav>

<div class="dashboard">

<h2>Reminder Manager 🔔</h2>

<div class="reminder-form">

<input id="reminderInput" type="text" placeholder="Reminder Title">
<input id="reminderDate" type="date">

<button id="addReminderBtn">Add Reminder</button>

</div>

<div id="reminderContainer" class="card-container"></div>

</div>

<script src="script.js"></script>

</body>
</html>
